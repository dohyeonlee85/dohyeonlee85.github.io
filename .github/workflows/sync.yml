# 매일 1회: 시트 새 상품 → 사진 WebP 변환 → R2 업로드 → products.json 갱신
name: 상품 동기화

on:
  schedule:
    - cron: '0 18 * * *'   # 매일 03:00 (한국 시간)
  workflow_dispatch:        # Actions 화면에서 수동 실행

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: 새 상품 처리
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/sync.py

      - name: products.json 커밋
        if: always()
        run: |
          if git diff --quiet products.json; then
            echo "새 상품 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          git commit -m "상품 동기화 $(TZ=Asia/Seoul date +%y%m%d)"
          git push
