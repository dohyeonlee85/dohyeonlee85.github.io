<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>shop</title>
<!-- 웹폰트: 영문·숫자 EB Garamond(세리프) + 한글 Pretendard (필요한 글자만 내려받음) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-TEC8Z6SS5Z"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-TEC8Z6SS5Z');
</script>
</head>
<body>

<!-- 상단 고정: 사이트명 + 🔍 검색 · 🛒 장바구니 · ☰ 소분류 메뉴 + 대분류 칩 줄 + 소분류 표시 줄 -->
<header id="top">
  <div class="bar">
    <a class="logo" href="#">shop</a>
    <input id="search" type="search" placeholder="search" autocomplete="off">
    <button id="sbtn" class="ibtn" type="button" aria-label="검색" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
    <a id="cbtn" class="ibtn" href="#/cart" aria-label="장바구니"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2.2 10.5h10.8L21 7.5H6.4"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg><span id="cartn" class="badge" hidden></span></a>
    <button id="mbtn" class="ibtn" type="button" aria-label="메뉴"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <div id="chips"></div>
  <div id="crumb" hidden><span id="crumbt"></span><button id="crumbx" type="button" aria-label="전체 보기">✕</button></div>
</header>

<!-- ☰ 전체 화면 메뉴: 대분류별 소분류 -->
<nav id="menu" hidden>
  <div class="mbar">
    <span id="mtitle">menu</span>
    <button id="mclose" type="button" aria-label="닫기">✕</button>
  </div>
  <ul id="mlist"></ul>
</nav>

<!-- 상품 목록: 신상 가로줄 + 전체 (정렬) -->
<main id="list">
  <section id="newbox" class="sec" hidden>
    <h2>이번 주 신상</h2>
    <div id="newrow" class="row"></div>
  </section>
  <section class="sec">
    <div class="sechead">
      <h2>전체</h2>
      <div id="sortbox">
        <button id="sortbtn" type="button" aria-haspopup="listbox"><span id="sortt">최신순</span><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        <ul id="sortlist" role="listbox" hidden>
          <li><button type="button" data-v="new">최신순</button></li>
          <li><button type="button" data-v="old">등록순</button></li>
          <li><button type="button" data-v="pop">인기순</button></li>
        </ul>
      </div>
    </div>
    <div id="grid" class="grid"></div>
  </section>
</main>
<div id="more"></div>
<p id="empty" hidden>상품 없음</p>
<button id="totop" type="button" hidden>TOP</button>

<!-- 상세 화면 -->
<section id="detail" hidden>
  <div class="dbar">
    <button id="back" type="button" aria-label="back">←</button>
  </div>
  <div class="gallery">
    <div id="slides"></div>
    <button id="prev" class="nav" type="button" aria-label="prev">‹</button>
    <button id="next" class="nav" type="button" aria-label="next">›</button>
    <button id="zoom" type="button" aria-label="zoom">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20M10.5 7.5v6M7.5 10.5h6"/></svg>
    </button>
    <span id="count"></span>
  </div>
  <div class="info">
    <p id="pid"></p>
    <p id="pname"></p>
    <p id="pprice"></p>
    <p id="pdesc"></p>
  </div>
  <div class="askbar">
    <button id="add" type="button">🛒 담기<span id="addn" class="badge" hidden></span></button>
    <button id="ask" type="button">💬 문의하기</button>
  </div>
</section>

<!-- 장바구니 페이지 (#/cart) -->
<section id="cartpage" hidden>
  <div class="dbar"><button id="cback" type="button" aria-label="back">←</button><h2>장바구니</h2><span></span></div>
  <div class="ctools">
    <label class="chk"><input id="call" type="checkbox"><i></i>전체 선택 <span id="cseln"></span></label>
    <button id="cdel" type="button">선택 삭제</button>
  </div>
  <ul id="clist"></ul>
  <p id="cempty">담은 상품 없음</p>
  <p class="cnote">이 휴대폰에만 저장 · 담은 지 14일 지나면 자동 삭제</p>
  <div class="askbar">
    <p id="csum"></p>
    <button id="cgo" type="button">💬 문의하기</button>
  </div>
</section>

<!-- 카카오톡 문의 안내 -->
<div id="guide" hidden>
  <div class="sheet">
    <h3>카카오톡으로 문의하기</h3>
    <div class="gmid">
      <div class="gimg"><img id="gthumb" alt="" draggable="false"></div>
      <ol class="steps">
        <li><b>1</b><div><em>노란 버튼</em> 누르기<small>문의 내용 자동 복사</small></div></li>
        <li><b>2</b><div>카톡 <em>입력칸</em><br>꾹 누르기</div></li>
        <li><b>3</b><div><em>붙여넣기</em> 후<br><em>전송</em></div></li>
      </ol>
    </div>
    <button id="go" type="button">문의하기</button>
    <button id="gclose" type="button">닫기</button>
  </div>
</div>

<!-- 확대 보기 (두 손가락으로 확대, PC는 마우스 휠) -->
<div id="viewer" hidden>
  <img id="vimg" alt="" draggable="false">
  <button id="vclose" type="button">닫기</button>
  <p class="vhint">두 손가락으로 확대 · 두 번 톡톡</p>
</div>

<div id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
